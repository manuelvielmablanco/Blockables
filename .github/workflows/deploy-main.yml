name: Deploy main → blocks.ingeniables.com

# Se dispara con cada push a la rama main
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Build para raíz
        env:
          # main se sirve desde la raíz del dominio: blocks.ingeniables.com/
          VITE_BASE_PATH: /
        run: npm run build

      - name: Subir a SiteGround via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./dist/
          # Despliegue a la raíz del subdominio (no /main/)
          server-dir: /blocks.ingeniables.com/public_html/
          # IMPORTANTE: dangerous-clean-slate quedaría tentador para
          # podar bundles huérfanos, pero borraría también el subfolder
          # /dev/ que está en la misma raíz. Lo dejamos en false: los
          # hashes viejos se acumulan pero no rompen nada (index.html es
          # no-cache y siempre apunta a los hashes actuales). Si hace
          # falta limpiar, hacerlo manualmente vía FTP/SiteGround.
          dangerous-clean-slate: false
          # Excluimos dev/ por si en el futuro activamos clean-slate y
          # como protección contra borrados accidentales por glob.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            dev/**
            dev
